services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: sorobanpool, POSTGRES_PASSWORD: sorobanpool, POSTGRES_DB: sorobanpool }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
  api:
    build: .
    env_file: .env
    environment: { ROLE: api }
    ports: ["3000:3000"]
    depends_on: [postgres, redis, minio]
